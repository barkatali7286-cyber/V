name: Build Jarvis APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download offline Hindi speech model
        run: |
          mkdir -p app/src/main/assets
          if curl -fL --retry 3 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip; then
            unzip -q hi.zip || true
            mv vosk-model-small-hi-0.22 app/src/main/assets/model-hi || true
            rm -f hi.zip
          else
            echo "Model download failed, building without offline model"
          fi
          ls app/src/main/assets || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/app-debug.apk
